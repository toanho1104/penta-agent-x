name: Publish to NPM

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Skip workflow if commit was generated by CI version bump
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Check & Auto-Bump Patch Version if Already Published
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Package: $PKG_NAME | Local version: $LOCAL_VERSION"

          # Query NPM registry for latest published version (returns empty if never published)
          PUBLISHED_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "")

          if [ -z "$PUBLISHED_VERSION" ]; then
            echo "Package $PKG_NAME is not published on NPM yet. Publishing initial version $LOCAL_VERSION..."
          else
            echo "Latest version on NPM: $PUBLISHED_VERSION"
            # Check if LOCAL_VERSION already exists on NPM
            EXISTING=$(npm view "${PKG_NAME}@${LOCAL_VERSION}" version 2>/dev/null || echo "")
            if [ -n "$EXISTING" ]; then
              echo "Version $LOCAL_VERSION already exists on NPM. Auto-bumping patch version from $PUBLISHED_VERSION..."
              npm version "$PUBLISHED_VERSION" --no-git-tag-version --allow-same-version
              NEW_VERSION=$(npm version patch --no-git-tag-version)
              echo "Bumped version to $NEW_VERSION"

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json
              git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]"
              git push origin HEAD:${GITHUB_REF_NAME}
            else
              echo "Local version $LOCAL_VERSION is new. Proceeding to publish..."
            fi
          fi

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
